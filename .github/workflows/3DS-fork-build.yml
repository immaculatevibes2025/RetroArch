name: 3DS fork build

on:
  push:
    branches: [3ds-xmb-icons]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: reallibretroretroarch/libretro-build-devkitpro:latest
      options: --user root

    steps:
    - uses: taiki-e/checkout-action@v1

    - name: Compile RA
      run: |
        make -f Makefile.ctr -j$(getconf _NPROCESSORS_ONLN) USE_CTRULIB_2=1 clean
        make -f Makefile.ctr -j$(getconf _NPROCESSORS_ONLN) USE_CTRULIB_2=1 HAVE_STATIC_DUMMY=1 all

    - uses: actions/upload-artifact@v4
      with:
        name: retroarch-3ds
        path: |
          retroarch_3ds.3dsx
          retroarch_3ds.cia
        if-no-files-found: error

    - name: Publish to 3ds-build branch
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        mkdir out && cp retroarch_3ds.3dsx retroarch_3ds.cia out/
        cd out
        git init -q -b 3ds-build
        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        echo "$SHA" > SOURCE_COMMIT
        git add -A
        git commit -q -m "3DS build of $SHA"
        git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" 3ds-build
